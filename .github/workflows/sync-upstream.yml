name: Sync upstream

# Rebuild each stable release of the original integration with a lower
# gain floor and publish it here, so HACS can install and update the fork.
# The work is in .github/scripts/build-patched-release.sh.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    name: Build and publish the patched release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gain-patch
          fetch-depth: 0

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: sfortis/openai_tts
          FORK: ${{ github.repository }}
          GAIN_DB_MIN: '-99.0'
        run: .github/scripts/build-patched-release.sh
